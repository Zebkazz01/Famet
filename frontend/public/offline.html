<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dc2626">
<title>Sin conexión</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    padding-top: calc(2rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
  }
  .container { text-align: center; max-width: 400px; }
  .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; opacity: 0.6; }
  .icon svg { width: 100%; height: 100%; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.8rem; color: #fff; }
  p { font-size: 0.95rem; color: #8b949e; line-height: 1.6; margin-bottom: 2rem; }
  .app-name { color: #dc2626; font-weight: 700; }
  .btn-retry {
    display: inline-block; padding: 12px 32px;
    background: #dc2626; color: #fff; border: none; border-radius: 8px;
    font-size: 1rem; font-weight: 500; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-retry:hover { background: #b91c1c; }
  .btn-retry:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"
        stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
  <h1>Sin conexión</h1>
  <p>La aplicación no pudo conectar con el servidor. Verifica tu conexión a internet e intenta de nuevo.</p>
  <button class="btn-retry" onclick="location.reload()">Reintentar</button>
</div>
</body>
</html>
