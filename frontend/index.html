<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POS</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Sistema de Punto de Venta con balanza digital" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#ffffff" />

    <!-- Manifest (dinámico, devuelve nombre+logo del negocio desde backend) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/pwa/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/pwa/icons/apple-touch-icon-76.png" />

    <!-- Montserrat (fuente global) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" />
  </head>
  <body style="background:#f3f4f6;margin:0">
    <div id="root">
      <div id="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Montserrat',system-ui,-apple-system,sans-serif;gap:16px">
        <div style="width:48px;height:48px;border:3px solid var(--ls-border);border-top-color:#14e0eb;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <div style="text-align:center">
          <p id="splash-name" style="color:#14e0eb;font-size:18px;font-weight:700;margin:0">POS</p>
          <p style="color:var(--ls-text);font-size:12px;margin:4px 0 0">Cargando sistema...</p>
        </div>
      </div>
      <style>
        @keyframes spin{to{transform:rotate(360deg)}}
        :root{--ls-border:#e2e8f0;--ls-text:#94a3b8;--ls-bg:#f3f4f6}
        .dark{--ls-border:#334155;--ls-text:#64748b;--ls-bg:#0f172a}
      </style>
      <script>
        try{
          var d=localStorage.getItem('fameat-theme')==='dark';
          if(d){document.documentElement.classList.add('dark');document.body.style.background='#111827'}
          else{document.body.style.background='#f3f4f6'}
          document.querySelector('meta[name=theme-color]').content=d?'#111827':'#ffffff';
          var c=JSON.parse(localStorage.getItem('fameat-config-cache')||'{}');
          if(c.business_name){
            document.title=c.business_name;
            var ap=document.querySelector('meta[name=apple-mobile-web-app-title]');
            if(ap)ap.content=c.business_name;
            var sn=document.getElementById('splash-name');
            if(sn)sn.textContent=c.business_name;
          }
          // Aplicar color de acento antes del primer paint (evita flash de color)
          var ACCENTS={
            rojo:    ['#fef2f2','#fee2e2','#fecaca','#fca5a5','#f87171','#ef4444','#dc2626','#b91c1c','#991b1b','#7f1d1d'],
            azul:    ['#eff6ff','#dbeafe','#bfdbfe','#93c5fd','#60a5fa','#3b82f6','#2563eb','#1d4ed8','#1e40af','#1e3a8a'],
            verde:   ['#ecfdf5','#d1fae5','#a7f3d0','#6ee7b7','#34d399','#10b981','#059669','#047857','#065f46','#064e3b'],
            naranja: ['#fff7ed','#ffedd5','#fed7aa','#fdba74','#fb923c','#f97316','#ea580c','#c2410c','#9a3412','#7c2d12'],
            violeta: ['#f5f3ff','#ede9fe','#ddd6fe','#c4b5fd','#a78bfa','#8b5cf6','#7c3aed','#6d28d9','#5b21b6','#4c1d95'],
            cian:    ['#ecfeff','#cffafe','#a5f3fc','#67e8f9','#22d3ee','#06b6d4','#0891b2','#0e7490','#155e75','#164e63'],
            rosa:    ['#fdf2f8','#fce7f3','#fbcfe8','#f9a8d4','#f472b6','#ec4899','#db2777','#be185d','#9d174d','#831843'],
            oscuro:  ['#f8fafc','#f1f5f9','#e2e8f0','#cbd5e1','#94a3b8','#64748b','#475569','#334155','#1e293b','#0f172a']
          };
          var SHADES=['50','100','200','300','400','500','600','700','800','900'];
          var accentId=c.accent_color||'rojo';
          var palette=ACCENTS[accentId]||ACCENTS.rojo;
          var rs=document.documentElement.style;
          for(var i=0;i<SHADES.length;i++){
            rs.setProperty('--color-red-'+SHADES[i],palette[i]);
            rs.setProperty('--accent-'+SHADES[i],palette[i]);
          }
          rs.setProperty('--accent-swatch',palette[5]);
        }catch(e){}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
